services:
  - type: web
    runtime: static
    name: o-cavaleiro-executivo
    buildCommand: bash scripts/build_web.sh
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: true
    previews:
      generation: automatic
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Godot keeps stable asset names between builds. They must be
      # revalidated so a browser never runs an old .pck after a deploy.
      - path: /*
        name: Cache-Control
        value: no-cache
