services:
  - type: web
    runtime: static
    name: o-cavaleiro-executivo
    buildCommand: bash scripts/build_web.sh
    staticPublishPath: ./dist
    previews:
      generation: automatic
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache

